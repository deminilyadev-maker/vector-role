[tox]
minversion = 1.8
basepython = python3
envlist = py3
skipsdist = true

[testenv]
passenv = *
setenv =
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS = True
deps =
    -r tox-requirements.txt
    ansible210: ansible<3.0
    ansible30: ansible<3.1
commands =
    {posargs:molecule test -s podman --destroy always}